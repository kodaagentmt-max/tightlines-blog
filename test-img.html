<!DOCTYPE html>
<html>
<head>
<title>Image Test</title>
<style>
.post-thumb {
  height: 140px;
  background: linear-gradient(135deg, #1a4a7a, #0f2847);
  display: flex;
  align-items: center;
  justify-content: center;
}
.post-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-img {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  display: block;
  margin: 16px auto;
}
</style>
</head>
<body>
<h1>Hero Image Test</h1>
<img class="hero-img" src="images/post-20260424.jpg" alt="Test">
<h2>Post Cards</h2>
<div id="grid"></div>
<script>
const POSTS = [{
  id: '20260424',
  tag: 'Industry News',
  emoji: '📰',
  title: 'Test Post',
  local_photo: 'images/post-20260424.jpg',
  photo: { alt: 'Fishing lures' }
}];

const grid = document.getElementById('grid');
grid.innerHTML = POSTS.map(p => `
  <div class="post-thumb">
    <img src="${p.local_photo}" alt="${p.photo?.alt || ''}" style="width:100%;height:100%;object-fit:cover;">
  </div>
`).join('');
</script>
</body>
</html>
